apiVersion: apps/v1
kind: Deployment

metadata:
  name: spark-equity
  namespace: streaming

spec:
  replicas: {{ .Values.replicas.sparkEquity }}

  selector:
    matchLabels:
      app: spark-equity

  template:
    metadata:
      labels:
        app: spark-equity

    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      serviceAccountName: streaming-sa

      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka..."
                sleep 5
              done

      containers:
        - name: spark-equity
          image: "{{ .Values.image.spark.repository }}:{{ .Values.image.spark.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}


          ports:
            - name: driver-rpc
              containerPort: 7078

            - name: blockmanager
              containerPort: 7079

            - name: ui
              containerPort: 4040

            - name: metrics
              containerPort: 8000

          envFrom:
            - secretRef:
                name: streaming-infra-secret

          env:
            - name: EQUITY_MODE
              value: "live"

            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            # Required so the Spark driver can register itself and own
            # dynamically created executor pods.
            - name: SPARK_DRIVER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          command: ["/bin/bash", "-lc"]

          args:
            - >
              spark-submit \
                --master {{ .Values.spark.k8sMasterUrl }} \
                --deploy-mode client \
                --conf spark.kubernetes.namespace={{ .Values.namespace }} \
                --conf spark.kubernetes.authenticate.driver.serviceAccountName=streaming-sa \
                --conf spark.kubernetes.container.image={{ .Values.image.spark.repository }}:{{ .Values.image.spark.tag }} \
                --conf spark.kubernetes.driver.pod.name=$(SPARK_DRIVER_POD_NAME) \
                --conf spark.driver.host=spark-equity-driver \
                --conf spark.driver.bindAddress=0.0.0.0 \
                --conf spark.driver.port=7078 \
                --conf spark.blockManager.port=7079 \
                --conf spark.network.timeout=600s \
                --conf spark.dynamicAllocation.enabled=false \
                --conf spark.pyspark.python=/usr/bin/python3 \
                --conf spark.pyspark.driver.python=/usr/bin/python3 \
                --conf spark.executorEnv.PYSPARK_PYTHON=/usr/bin/python3 \
                --conf spark.executor.instances={{ .Values.spark.executors.live }} \
                --conf spark.executor.cores={{ .Values.spark.executorCores }} \
                --conf spark.executor.memory={{ .Values.spark.executorMemory }} \
                --conf spark.driver.cores={{ .Values.spark.driverCores }} \
                --conf spark.driver.memory={{ .Values.spark.driverMemory }} \
                --conf spark.kubernetes.executor.podNamePrefix=spark-equity-exec \
                --conf spark.local.dir=/tmp/spark \
                --packages org.slf4j:slf4j-api:2.0.7 \
                /app/test_spark.py

          volumeMounts:
            - name: ivy-cache
              mountPath: /root/.ivy2

      volumes:
        - name: ivy-cache
          persistentVolumeClaim:
            claimName: spark-ivy-cache-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: spark-equity
  namespace: streaming
  labels:
    app: spark-equity

spec:
  selector:
    app: spark-equity

  ports:
    - name: ui
      port: 4040
      targetPort: 4040

    - name: blockmanager
      port: 7079
      targetPort: 7079

    - name: metrics
      port: 8000
      targetPort: 8000

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spark-equity
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - streaming

  selector:
    matchLabels:
      app: spark-equity

  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s