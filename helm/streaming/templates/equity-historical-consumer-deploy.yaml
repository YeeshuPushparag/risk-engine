apiVersion: apps/v1
kind: Deployment

metadata:
  name: equity-historical-consumer
  namespace: streaming

spec:
  replicas: 0

  selector:
    matchLabels:
      app: equity-historical-consumer

  template:
    metadata:
      labels:
        app: equity-historical-consumer

    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      serviceAccountName: streaming-sa

      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka..."
                sleep 5
              done

      containers:
        - name: equity-historical-consumer
          image: "{{ .Values.image.spark.repository }}:{{ .Values.image.spark.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: driver-rpc
              containerPort: 7076

            - name: blockmanager
              containerPort: 7081

            - name: ui
              containerPort: 4042

            - name: metrics
              containerPort: 8000

          envFrom:
            - secretRef:
                name: streaming-infra-secret

          env:
            - name: SPARK_LOCAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: SPARK_DRIVER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          command: ["/bin/bash", "-lc"]

          args:
            - >
              spark-submit \
                --master {{ .Values.spark.k8sMasterUrl }} \
                --deploy-mode client \
                --conf spark.kubernetes.namespace={{ .Values.namespace }} \
                --conf spark.kubernetes.authenticate.driver.serviceAccountName=streaming-sa \
                --conf spark.kubernetes.container.image={{ .Values.image.spark.repository }}:{{ .Values.image.spark.tag }} \
                --conf spark.kubernetes.driver.pod.name=$(SPARK_DRIVER_POD_NAME) \
                --conf spark.driver.host=equity-historical-driver \
                --conf spark.driver.bindAddress=0.0.0.0 \
                --conf spark.driver.port=7076 \
                --conf spark.ui.port=4042 \
                --conf spark.blockManager.port=7081 \
                --conf spark.network.timeout=600s \
                --conf spark.dynamicAllocation.enabled=false \
                --conf spark.pyspark.python=/usr/bin/python3 \
                --conf spark.pyspark.driver.python=/usr/bin/python3 \
                --conf spark.executorEnv.PYSPARK_PYTHON=/usr/bin/python3 \
                --conf spark.executor.instances={{ .Values.spark.executors.backfillReplay }} \
                --conf spark.executor.cores={{ .Values.spark.executorCores }} \
                --conf spark.executor.memory={{ .Values.spark.executorMemory }} \
                --conf spark.driver.cores={{ .Values.spark.driverCores }} \
                --conf spark.driver.memory={{ .Values.spark.driverMemory }} \
                --conf spark.kubernetes.executor.podNamePrefix=equity-historical-exec \
                --conf spark.local.dir=/tmp/spark \
                /app/equity_consumer.py