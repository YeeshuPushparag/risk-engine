replicaCount:
  apiServer: 1
  scheduler: 1
  worker: 1
  dagProcessor: 1
  triggerer: 1

image:
  repository: 363267429137.dkr.ecr.us-east-1.amazonaws.com/airflow
  tag: "127"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

nodeSelector:
  role: platform-core

ingress:
  enabled: true
  host: airflow.pushparag.online
  ingressClassName: alb
  groupName: risk-engine
  scheme: internet-facing
  targetType: ip
  listenPorts: '[{"HTTP":80},{"HTTPS":443}]'
  sslRedirect: "443"
  certificateArn: arn:aws:acm:us-east-1:363267429137:certificate/96bea5e5-6646-4921-8328-0577cfb4f91d

# Environment injection
envFrom:
  configMapName: airflow-config
  secretName: airflow-secret

# Airflow DB init & migrations
airflowInit:
  enabled: true
  runMigrations: true

# ======================================
# ✅ Persistence (UPDATED FOR S3 LOGGING)
# ======================================
persistence:
  logs:
    enabled: false     # ✅ DISABLED — logs now stored in S3
  dags:
    enabled: false
  postgres:
    enabled: false