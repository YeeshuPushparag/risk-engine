prometheus-cloudwatch-exporter:

  ##################################
  # SERVICE ACCOUNT (IRSA)
  ##################################
  serviceAccount:
    create: false
    name: prometheus

  ##################################
  # AWS REGION
  ##################################
  aws:
    region: us-east-1

  ##################################
  # SERVICE
  ##################################
  service:
    type: ClusterIP
    port: 9106

  ##################################
  # SERVICEMONITOR
  ##################################
  serviceMonitor:
    enabled: true
    namespace: monitoring

    # THIS LABEL MUST MATCH PROMETHEUS SELECTOR
    labels:
      release: monitoring

    interval: 30s
    scrapeTimeout: 10s

  ##################################
  # CLOUDWATCH METRICS CONFIG
  ##################################
  config: |
    region: us-east-1
    metrics:

      ##################################################
      # RDS — risk-postgres
      ##################################################

      # ---- CPU ----
      - aws_namespace: AWS/RDS
        aws_metric_name: CPUUtilization
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average, Maximum]
        period_seconds: 300
        range_seconds: 3600

      # ---- Memory ----
      - aws_namespace: AWS/RDS
        aws_metric_name: FreeableMemory
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average, Minimum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/RDS
        aws_metric_name: SwapUsage
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      # ---- Storage ----
      - aws_namespace: AWS/RDS
        aws_metric_name: FreeStorageSpace
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average, Minimum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/RDS
        aws_metric_name: DiskQueueDepth
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/RDS
        aws_metric_name: BurstBalance
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average, Minimum]
        period_seconds: 300
        range_seconds: 3600

      # ---- Connections ----
      - aws_namespace: AWS/RDS
        aws_metric_name: DatabaseConnections
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average, Maximum]
        period_seconds: 300
        range_seconds: 3600

      # ---- IOPS / Throughput ----
      - aws_namespace: AWS/RDS
        aws_metric_name: ReadIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/RDS
        aws_metric_name: WriteIOPS
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/RDS
        aws_metric_name: ReadThroughput
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/RDS
        aws_metric_name: WriteThroughput
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      # ---- Latency ----
      - aws_namespace: AWS/RDS
        aws_metric_name: ReadLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average, Maximum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/RDS
        aws_metric_name: WriteLatency
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average, Maximum]
        period_seconds: 300
        range_seconds: 3600

      # ---- Network ----
      - aws_namespace: AWS/RDS
        aws_metric_name: NetworkReceiveThroughput
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/RDS
        aws_metric_name: NetworkTransmitThroughput
        aws_dimensions: [DBInstanceIdentifier]
        aws_dimension_select:
          DBInstanceIdentifier:
            - risk-postgres
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      ##################################################
      # ELASTICACHE — risk-redis
      ##################################################

      # ---- CPU ----
      - aws_namespace: AWS/ElastiCache
        aws_metric_name: CPUUtilization
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average, Maximum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/ElastiCache
        aws_metric_name: EngineCPUUtilization
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average, Maximum]
        period_seconds: 300
        range_seconds: 3600

      # ---- Memory ----
      - aws_namespace: AWS/ElastiCache
        aws_metric_name: FreeableMemory
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average, Minimum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/ElastiCache
        aws_metric_name: DatabaseMemoryUsagePercentage
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average, Maximum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/ElastiCache
        aws_metric_name: SwapUsage
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      # ---- Connections ----
      - aws_namespace: AWS/ElastiCache
        aws_metric_name: CurrConnections
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average, Maximum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/ElastiCache
        aws_metric_name: NewConnections
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Sum]
        period_seconds: 300
        range_seconds: 3600

      # ---- Cache effectiveness ----
      - aws_namespace: AWS/ElastiCache
        aws_metric_name: CacheHits
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Sum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/ElastiCache
        aws_metric_name: CacheMisses
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Sum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/ElastiCache
        aws_metric_name: Evictions
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Sum]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/ElastiCache
        aws_metric_name: CurrItems
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      # ---- Network ----
      - aws_namespace: AWS/ElastiCache
        aws_metric_name: NetworkBytesIn
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      - aws_namespace: AWS/ElastiCache
        aws_metric_name: NetworkBytesOut
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average]
        period_seconds: 300
        range_seconds: 3600

      # ---- Replication (only emits data if risk-redis has a replica; harmless no-op otherwise) ----
      - aws_namespace: AWS/ElastiCache
        aws_metric_name: ReplicationLag
        aws_dimensions: [CacheClusterId]
        aws_dimension_select:
          CacheClusterId:
            - risk-redis
        aws_statistics: [Average, Maximum]
        period_seconds: 300
        range_seconds: 3600